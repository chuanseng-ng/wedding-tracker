version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react-dom throws React error #527 at module load unless it resolves to
      # the EXACT same version as react — a white blank page on every route. Its
      # peer range is loose enough that npm accepts a split pair, so the two must
      # never arrive in separate PRs. src/lib/reactVersions.test.js is the backstop.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # api/_lib/photoStorage/r2.js passes an @aws-sdk/client-s3 command straight to
      # getSignedUrl() from @aws-sdk/s3-request-presigner. AWS cuts the whole
      # @aws-sdk/* family from one release train, but they reach the shared signing
      # internals through loose "^" ranges, so npm accepts a split pair — and the
      # break only shows up server-side, on a real guest upload. They drifted to
      # 3.1096.0 / 3.1091.0 while ungrouped. src/lib/awsSdkVersions.test.js is the
      # backstop.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
