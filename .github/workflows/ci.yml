name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # The audit gate below queries the LIVE advisory DB, so main is only re-audited
  # when something is pushed to it. A newly published high advisory therefore
  # reddens every open PR while main still shows green — six Dependabot PRs sat
  # broken on advisories main had picked up weeks earlier. Re-run weekly so the
  # gate fails on main first, on Monday, ahead of Dependabot's Tuesday run.
  schedule:
    - cron: "17 6 * * 1"
  # Lets a maintainer re-audit main on demand without an empty push.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fail the build if a dependency has a high or critical advisory, except
      # for a small documented allowlist of advisories that don't apply to this
      # app (see scripts/security-audit.mjs).
      - run: node scripts/security-audit.mjs
